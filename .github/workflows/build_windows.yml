name: Build & Publish Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests pyinstaller

      - name: Inject Secret Gist URL into app.py before building
        env:
          SECRET_GIST_URL: ${{ secrets.REMOTE_CONFIG_URL }}
        shell: pwsh
        run: |
          if ($env:SECRET_GIST_URL) {
            (Get-Content app.py -Raw) -replace 'REMOTE_CONFIG_URL = ".*"', "REMOTE_CONFIG_URL = `"$env:SECRET_GIST_URL`"" | Set-Content app.py -Encoding UTF8
          }

      - name: Build single-file Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "ArabicTranscriber" app.py

      - name: Publish EXE to 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest || gh release create latest --title "Latest Windows Build" --notes "Automated Windows EXE build"
          gh release upload latest dist/ArabicTranscriber.exe --clobber
