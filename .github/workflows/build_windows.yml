name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests pyinstaller

      - name: Build single-file Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "مفرغ_فيديوهات_يوتيوب" app.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-YouTube-Transcriber-Windows
          path: dist/*.exe
